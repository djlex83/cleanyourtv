<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Fokus Rahmen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&amp;family=Instrument+Serif:ital@0;1&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#78aee8}a:hover{color:#a9cdf2}
</style>
</helmet>
<div style="width: 960px; height: 540px; box-sizing: border-box; background: #111110; color: #f1efea; font-family: Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif; padding: 34px 48px 30px; display: flex; flex-direction: column;">
  <header style="display: flex; justify-content: space-between; align-items: flex-start;">
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <span style="font-size: 12px; letter-spacing: 0.22em; color: rgba(241,239,234,0.64);">GUTEN ABEND</span>
      <span style="font-weight: 300; font-size: 60px; line-height: 0.95; letter-spacing: -0.05em; font-variant-numeric: tabular-nums;">21:45</span>
      <span style="font-family: 'Instrument Serif', 'Times New Roman', serif; font-style: italic; font-size: 24px;">Freitag, 23. Oktober</span>
    </div>
    <sc-if value="{{iconOnly}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; gap: 10px; margin-top: 14px;">
        <button type="button" aria-label="Eingänge" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: rgba(56,54,50,0.62); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; color: #f1efea;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="7" width="18" height="10" rx="2"></rect><path d="M7 11h10"></path></svg></button>
        <button type="button" aria-label="WLAN" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: rgba(56,54,50,0.62); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; color: #6cbf86;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"></path><circle cx="12" cy="19.5" r="1"></circle></svg></button>
        <button type="button" aria-label="Einstellungen" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: rgba(56,54,50,0.62); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; color: #f1efea;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg></button>
      </div>
    </sc-if>
    <sc-if value="{{pills}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; gap: 10px; margin-top: 14px;">
        <button type="button" style="height: 44px; padding: 0 18px; border: 0; border-radius: 22px; background: rgba(56,54,50,0.62); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1); font-family: inherit; font-size: 15px; font-weight: 500; color: #f1efea;">Eingänge</button>
        <button type="button" style="height: 44px; padding: 0 18px; border: 0; border-radius: 22px; background: rgba(56,54,50,0.62); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1); font-family: inherit; font-size: 15px; font-weight: 500; color: #f1efea;">WLAN</button>
        <button type="button" style="height: 44px; padding: 0 18px; border: 0; border-radius: 22px; background: rgba(56,54,50,0.62); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1); font-family: inherit; font-size: 15px; font-weight: 500; color: #f1efea;">Einstellungen</button>
      </div>
    </sc-if>
  </header>

  <span style="margin-top: auto; margin-bottom: 14px; font-size: 34px; font-weight: 400; letter-spacing: -0.02em;">{{focusedName}}</span>
  <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 20px; align-items: center; padding: {{dockPad}}; border-radius: 22px; background: {{dockBg}}; box-shadow: {{dockEdge}};">
    <sc-for list="{{tiles}}" as="t" hint-placeholder-count="5">
      <div style="height: 88px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: {{t.bg}}; color: {{t.fg}}; box-shadow: {{t.ring}}; transform: scale({{t.scale}}); font-size: 17px; font-weight: 500;">
        <sc-if value="{{t.text}}" hint-placeholder-val="{{true}}"><span>{{t.name}}</span></sc-if>
        <sc-if value="{{t.glyph}}" hint-placeholder-val="{{false}}"><svg width="{{t.size}}" height="{{t.size}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" opacity="{{t.alpha}}" role="img" aria-label="{{t.name}}"><path d="{{t.d}}"></path></svg></sc-if>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":540}}'>
class Component extends DCLogic {
renderVals() {
const V = { iconOnly: false, band: 'solid', tile: 'banner', focus: 'rim' };
const apps = [
  { name: 'Netflix', bg: '#141414', top: '#2a2a2a', fg: '#e50914', d: 'M7 3v18M17 3v18M7 3l10 18' },
  { name: 'Glashaus', bg: '#f1efea', top: '#ffffff', fg: '#111110', d: 'M3 11l9-7 9 7M5 10v10h14V10M10 20v-5h4v5' },
  { name: 'YouTube', bg: '#f4f4f4', top: '#ffffff', fg: '#ff0033', d: 'M3 8a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3zM10 9l5 3-5 3z' },
  { name: 'Prime Video', bg: '#1a98ff', top: '#4fb1ff', fg: '#ffffff', d: 'M4 14c5 4 11 4 16 0M17 13l3 1-1 3' },
  { name: 'Disney+', bg: '#0b1d5a', top: '#17348f', fg: '#ffffff', d: 'M4 16c2-8 10-11 15-7M12 7v13M18 4v4M16 6h4' }
];
const rings = { glass: '0 0 0 2px rgba(255,255,255,0.95), 0 0 22px 2px rgba(255,255,255,0.22)', rim: '0 0 0 2px #ffffff', halo: '0 0 0 2px #ffffff, 0 0 30px 6px rgba(255,255,255,0.35)' };
const sheen = 'linear-gradient(rgba(255,255,255,0.3), rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.14))';
const tiles = apps.map((a, i) => {
  const f = i === 1;
  let bg = a.bg, fg = a.fg;
  if (V.tile === 'uniform') { bg = 'linear-gradient(' + a.top + ', ' + a.bg + ')'; }
  if (V.tile === 'mono') { bg = f && V.focus === 'glass' ? sheen : 'transparent'; fg = '#ffffff'; }
  return { name: a.name, d: a.d, bg: bg, fg: fg, text: V.tile === 'banner', glyph: V.tile !== 'banner',
    size: V.tile === 'mono' ? 46 : 36, alpha: V.tile === 'mono' && !f ? 0.82 : 1,
    ring: f ? (V.tile === 'mono' && V.focus === 'glass' ? 'inset 0 0 0 1px rgba(255,255,255,0.35)' : rings[V.focus]) : 'none', scale: f ? 1.1 : 1 };
});
const bands = {
  solid: { pad: '18px', bg: '#1c1c1b', edge: 'inset 0 0 0 1px rgba(255,255,255,0.08)' },
  glass: { pad: '18px', bg: 'rgba(255,255,255,0.08)', edge: 'inset 0 0 0 1px rgba(255,255,255,0.16)' },
  none: { pad: '0px', bg: 'transparent', edge: 'none' }
};
const b = bands[V.band];
return { iconOnly: V.iconOnly, pills: !V.iconOnly, tiles: tiles, focusedName: 'Glashaus', dockPad: b.pad, dockBg: b.bg, dockEdge: b.edge };
}
}
</script>
</body>
</html>
